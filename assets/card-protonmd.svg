  <rect x="26" y="88" width="120" height="2.5" fill="url(#b)"/>
  <text class="m" x="26" y="118" font-size="13.5" fill="#A9B4C2">Diagnose why Linux games</text>
  <text class="m" x="26" y="138" font-size="13.5" fill="#A9B4C2">will not run: Steam, Proton,</text>
