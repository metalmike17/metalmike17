  <style>.m{font-family:"JetBrains Mono","Fira Code",Consolas,"DejaVu Sans Mono",monospace}@keyframes p{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}.bd{animation:p 3s ease-in-out infinite}</style>
